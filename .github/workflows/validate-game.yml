name: Validate game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check js/game-config.js
          node --check js/game.js
          node --check js/repair-systems.js
          node --check js/mobile-controls.js
          node --check js/pwa.js
          node --check sw.js
      - name: Structure and regression guards
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          root=Path('.')
          json.load(open('manifest.json',encoding='utf-8'))
          html=Path('index.html').read_text(encoding='utf-8')
          refs=re.findall(r'(?:src|href)=["\']([^"\']+)',html)
          missing=[]
          for ref in refs:
              if ref.startswith(('http://','https://','#','data:','mailto:','javascript:')): continue
              ref=ref.split('?',1)[0]
              if ref and not (root/ref).exists(): missing.append(ref)
          assert not missing, f'Missing refs: {missing}'
          ids=re.findall(r'id="([^"]+)"',html)
          dup=sorted({x for x in ids if ids.count(x)>1})
          assert not dup, f'Duplicate IDs: {dup}'
          js=Path('js/game.js').read_text(encoding='utf-8')
          repair=Path('js/repair-systems.js').read_text(encoding='utf-8')
          config=Path('js/game-config.js').read_text(encoding='utf-8')
          sw=Path('sw.js').read_text(encoding='utf-8')
          assert 'SAVE_VERSION: 6' in config
          assert 'const waitingCars=[]' in js and 'MAX_WAITING_CARS=4' in js
          assert 'function resolveChainProblems' in js
          assert 'OverlayManager' in js and 'isGameplayBlocked()' in js
          assert 'function isPartsShopUnlocked' in js
          assert 'latePenaltyApplied' in js and 'hasDueBills' in js
          assert '_playerRepairSpeedMult=1.25' in js
          assert 'devicePixelRatio' in js and 'moveMag=Math.hypot(dx,dy)' in js
          assert 'function drawRepairVehicleVisuals' in repair
          assert 'mecanica-ze-v15' in sw
          assert './assets/sprites/cantina.webp' in sw
          assert 'const CANTINA_SPRITE' in js
          assert 'const cantineArea={x:380,y:815,w:200,h:175}' in js
          assert Path('assets/sprites/cantina.webp').exists()
          assert 'SKIP_WAITING' in sw
          assert not Path('ico1000.png').exists()
          print('OK: v3.1 regression guards')
          PY
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run browser smoke test
        run: |
          python -m http.server 8765 >/tmp/mecanica-http.log 2>&1 &
          python tests/browser_smoke.py
